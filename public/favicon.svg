<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="70%" stop-color="#020408"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Block 1 Gradients (Cyan) -->
    <linearGradient id="cyanTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cyanLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="cyanRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>

    <!-- Block 2 Gradients (Magenta) -->
    <linearGradient id="magTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="magLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#701a75"/>
    </linearGradient>
    <linearGradient id="magRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a21caf"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <!-- Block 3 Gradients (Gold/Yellow) -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="goldLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="goldRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Neon Border Ring -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.4" filter="url(#neonGlow)"/>

  <!-- Cyber Grid Lines in Background -->
  <path d="M 96 160 L 416 160 M 96 256 L 416 256 M 96 352 L 416 352 M 160 96 L 160 416 M 256 96 L 256 416 M 352 96 L 352 416" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- 3D Isometric T-Polyomino Group -->
  <!-- Center Base Origin: X=256, Y=260. Grid Unit: dx=60, dy=34. Height dz=60 -->
  <g filter="url(#neonGlow)">
    
    <!-- CUBE 1 (Center Top) -->
    <g transform="translate(256, 150)">
      <!-- Top Face -->
      <polygon points="0,-34 60,0 0,34 -60,0" fill="url(#cyanTop)"/>
      <!-- Left Face -->
      <polygon points="-60,0 0,34 0,94 -60,60" fill="url(#cyanLeft)"/>
      <!-- Right Face -->
      <polygon points="0,34 60,0 60,60 0,94" fill="url(#cyanRight)"/>
      <!-- Highlight Edges -->
      <path d="M -60,0 L 0,-34 L 60,0 M 0,-34 L 0,34" stroke="#e0f2fe" stroke-width="2" fill="none"/>
    </g>

    <!-- CUBE 2 (Center Middle) -->
    <g transform="translate(256, 238)">
      <!-- Top Face -->
      <polygon points="0,-34 60,0 0,34 -60,0" fill="url(#cyanTop)"/>
      <!-- Left Face -->
      <polygon points="-60,0 0,34 0,94 -60,60" fill="url(#cyanLeft)"/>
      <!-- Right Face -->
      <polygon points="0,34 60,0 60,60 0,94" fill="url(#cyanRight)"/>
      <path d="M -60,0 L 0,-34 L 60,0 M 0,-34 L 0,34" stroke="#e0f2fe" stroke-width="2" fill="none"/>
    </g>

    <!-- CUBE 3 (Left Arm - Magenta) -->
    <g transform="translate(196, 272)">
      <!-- Top Face -->
      <polygon points="0,-34 60,0 0,34 -60,0" fill="url(#magTop)"/>
      <!-- Left Face -->
      <polygon points="-60,0 0,34 0,94 -60,60" fill="url(#magLeft)"/>
      <!-- Right Face -->
      <polygon points="0,34 60,0 60,60 0,94" fill="url(#magRight)"/>
      <path d="M -60,0 L 0,-34 L 60,0 M 0,-34 L 0,34" stroke="#fce7f3" stroke-width="2" fill="none"/>
    </g>

    <!-- CUBE 4 (Right Arm - Gold) -->
    <g transform="translate(316, 272)">
      <!-- Top Face -->
      <polygon points="0,-34 60,0 0,34 -60,0" fill="url(#goldTop)"/>
      <!-- Left Face -->
      <polygon points="-60,0 0,34 0,94 -60,60" fill="url(#goldLeft)"/>
      <!-- Right Face -->
      <polygon points="0,34 60,0 60,60 0,94" fill="url(#goldRight)"/>
      <path d="M -60,0 L 0,-34 L 60,0 M 0,-34 L 0,34" stroke="#fef9c3" stroke-width="2" fill="none"/>
    </g>

    <!-- CUBE 5 (Center Bottom) -->
    <g transform="translate(256, 326)">
      <!-- Top Face -->
      <polygon points="0,-34 60,0 0,34 -60,0" fill="url(#cyanTop)"/>
      <!-- Left Face -->
      <polygon points="-60,0 0,34 0,94 -60,60" fill="url(#cyanLeft)"/>
      <!-- Right Face -->
      <polygon points="0,34 60,0 60,60 0,94" fill="url(#cyanRight)"/>
      <path d="M -60,0 L 0,-34 L 60,0 M 0,-34 L 0,34" stroke="#e0f2fe" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Energy Pulse Aura Bottom -->
  <ellipse cx="256" cy="430" rx="140" ry="35" fill="#06b6d4" opacity="0.25" filter="url(#neonGlow)"/>
</svg>